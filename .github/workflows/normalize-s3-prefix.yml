name: Normalize S3 Prefix

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "S3 bucket"
        required: true
        default: "amud-technologies"
      prefix:
        description: >-
          S3 prefix to normalize (every raw file under it). Default is the
          semiannual expiring-deposits radar; override for an irregular
          active-deposits batch, e.g.
          raw/judicial-branch/active-deposits/2026-08-30/
        required: true
        default: "raw/judicial-branch/expiring-deposits/"
      staging_prefix:
        description: "S3 prefix to write staging Parquet under"
        required: true
        default: "staging/jd_published_deposit"
      reject_prefix:
        description: "S3 prefix to write reject Parquet under"
        required: true
        default: "staging/jd_reject"

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Normalize (Phase 2)
        run: >
          uv run claims-engine normalize-s3-prefix
          "${{ inputs.bucket }}" "${{ inputs.prefix }}"
          --staging-prefix "${{ inputs.staging_prefix }}"
          --reject-prefix "${{ inputs.reject_prefix }}"
