name: Build Identity

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "S3 bucket"
        required: true
        default: "amud-technologies"
      staging_prefix:
        description: "S3 prefix staging Parquet was written under"
        required: true
        default: "staging/jd_published_deposit"

jobs:
  build-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build core/{party,court,court_name} (Phase 3)
        run: >
          uv run claims-engine build-identity
          "${{ inputs.bucket }}"
          --staging-prefix "${{ inputs.staging_prefix }}"
