name: Build Identity

on:
  workflow_run:
    # Runs after Enrich Parties so newly-learned document_type
    # classifications (D26 -- sourced from RUES, not inferred here) get
    # folded back onto core/party instead of sitting unused in
    # core/enrichment/ until someone remembers to trigger this manually.
    workflows: ["Enrich Parties"]
    types: [completed]
  workflow_dispatch:
    inputs:
      bucket:
        description: "S3 bucket"
        required: true
        default: "amud-technologies"
      staging_prefix:
        description: "S3 prefix staging Parquet was written under"
        required: true
        default: "staging/jd_published_deposit"

jobs:
  build-identity:
    runs-on: ubuntu-latest
    # Only proceed on the manual trigger, or when the Enrich Parties run
    # it's chained to actually succeeded -- never chain onto a failed run.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build core/{party,court,court_name} (Phase 3)
        run: >
          uv run claims-engine build-identity
          "${{ github.event.inputs.bucket || 'amud-technologies' }}"
          --staging-prefix "${{ github.event.inputs.staging_prefix || 'staging/jd_published_deposit' }}"
