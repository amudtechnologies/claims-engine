name: Check Document Types

on:
  workflow_run:
    workflows: ["Enrich Parties"]
    types: [completed]
  workflow_dispatch:
    inputs:
      bucket:
        description: "S3 bucket"
        required: true
        default: "amud-technologies"
      limit:
        description: "Max unchecked exhausted-signal natural_person parties to query this run"
        required: true
        default: "50"
      delay_seconds:
        description: "Pause between RUES requests, in seconds"
        required: true
        default: "3.0"

jobs:
  check-document-types:
    runs-on: ubuntu-latest
    # Only proceed on the schedule/manual trigger path (no workflow_run event),
    # or when the Enrich Parties run it's chained to actually succeeded --
    # never chain onto a failed enrichment run.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Check document types via RUES
        run: >
          uv run claims-engine check-document-types
          "${{ github.event.inputs.bucket || 'amud-technologies' }}"
          --limit ${{ github.event.inputs.limit || '50' }}
          --delay-seconds ${{ github.event.inputs.delay_seconds || '3.0' }}
