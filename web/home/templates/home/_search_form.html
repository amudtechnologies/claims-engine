<form class="search-form{% if compact %} search-form--compact{% endif %}" method="get" action="{% url 'home:results' %}" data-search-form>
  <label class="visually-hidden" for="document-number">Número de identificación (NIT o cédula)</label>
  <input
    class="search-form-input"
    id="document-number"
    type="text"
    name="nit"
    value="{{ raw_document_number }}"
    placeholder="NIT de su empresa"
    inputmode="numeric"
    autocomplete="off"
    required
  >
  <button type="submit" class="btn btn-primary search-form-btn">
    <span class="btn-label">{{ button_label|default:"Consultar" }}</span>
    <span class="btn-spinner" aria-hidden="true"></span>
  </button>
  <span class="search-progress" aria-hidden="true"></span>
  <span class="visually-hidden" role="status" aria-live="polite" data-search-status></span>
</form>
{% if not compact %}
  <p class="search-form-hint">NIT de su empresa, con o sin dígito de verificación. Si es persona natural, también puede consultar con su cédula.</p>
  <p class="search-form-trust">Consulta gratuita · sin registro</p>
{% endif %}
