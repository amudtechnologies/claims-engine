<div class="share">
  <span class="share-label mono">Compartir</span>
  <a href="https://wa.me/?text={{ title|urlencode }}%20{{ url|urlencode }}" target="_blank" rel="noopener noreferrer">WhatsApp</a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ url|urlencode }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  <a href="https://twitter.com/intent/tweet?url={{ url|urlencode }}&amp;text={{ title|urlencode }}" target="_blank" rel="noopener noreferrer">X</a>
</div>
